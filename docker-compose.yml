services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pipeline}
      POSTGRES_USER: ${POSTGRES_USER:-pipeline}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pipeline}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pipeline} -d ${POSTGRES_DB:-pipeline}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-pipeline}
      DB_USER: pipeline_app
      DB_PASSWORD: ${APP_DB_PASSWORD:-pipeline_app}
      DB_MIGRATION_USER: ${POSTGRES_USER:-pipeline}
      DB_MIGRATION_PASSWORD: ${POSTGRES_PASSWORD:-pipeline}
      API_KEY: ${API_KEY:-change-me-local-only}
      RECRUITER_ID: ${RECRUITER_ID:-recruiter-1}
      RECRUITER_NAME: ${RECRUITER_NAME:-Asha Menon}
      RATE_LIMIT_BACKEND: ${RATE_LIMIT_BACKEND:-redis}
      RATE_LIMIT_WRITE: ${RATE_LIMIT_WRITE:-20}
      RATE_LIMIT_READ: ${RATE_LIMIT_READ:-300}
      RATE_LIMIT_SEARCH: ${RATE_LIMIT_SEARCH:-60}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      LOG_FORMAT: ${LOG_FORMAT:-ecs}
      SEED_ENABLED: ${SEED_ENABLED:-true}
      SEED_CANDIDATES: ${SEED_CANDIDATES:-200}
      SEED_BASE_INSTANT: ${SEED_BASE_INSTANT:-}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # Not for the backend's own sake — it is so the frontend can wait for a backend that
      # can actually answer. Without it the first page load races the migrations and the
      # seed, and "docker compose up" shows an error page on a system that is merely
      # still starting.
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/actuator/health | grep -q UP"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 40s

  frontend:
    build: ./frontend
    environment:
      # Service name, not localhost: this reaches Spring over the compose network, and
      # the browser never does.
      API_BASE_URL: http://backend:8080
      # The same key the backend expects, held only here. It is never sent to the browser.
      API_KEY: ${API_KEY:-change-me-local-only}
      SESSION_RATE_LIMIT: ${SESSION_RATE_LIMIT:-240}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data:
