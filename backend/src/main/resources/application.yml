spring:
  application:
    name: pipeline
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pipeline}
    username: ${DB_USER:pipeline}
    password: ${DB_PASSWORD:pipeline}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
