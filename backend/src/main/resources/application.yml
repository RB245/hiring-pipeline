spring:
  application:
    name: pipeline
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pipeline}
    # pipeline_app: SELECT/INSERT/UPDATE only, and no DDL. Created by V7.
    username: ${DB_USER:pipeline_app}
    password: ${DB_PASSWORD:pipeline_app}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    # Migrations run as a separate, privileged identity. If Flyway shared the
    # application's connection the revokes in V7 would mean nothing, since the app
    # could simply migrate the trigger away.
    user: ${DB_MIGRATION_USER:pipeline}
    password: ${DB_MIGRATION_PASSWORD:pipeline}
    placeholders:
      app_password: ${DB_PASSWORD:pipeline_app}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus

logging:
  structured:
    format:
      # One line of JSON per log line, with MDC entries promoted to fields, so the
      # correlation id is queryable rather than buried in a message.
      console: ${LOG_FORMAT:ecs}
    json:
      customizer: com.pipeline.infrastructure.MaskEmails

pipeline:
  auth:
    # No default. A default key is a key in the repository.
    api-key: ${API_KEY}
    recruiter-id: ${RECRUITER_ID:recruiter-1}
    recruiter-name: ${RECRUITER_NAME:Asha Menon}
  rate-limit:
    backend: ${RATE_LIMIT_BACKEND:memory}
    write: ${RATE_LIMIT_WRITE:20}
    read: ${RATE_LIMIT_READ:300}
    search: ${RATE_LIMIT_SEARCH:60}
    window: ${RATE_LIMIT_WINDOW:1m}
    redis-host: ${REDIS_HOST:localhost}
    redis-port: ${REDIS_PORT:6379}
  search:
    # How long the edit-distance retry behind a zero-result suggestion may run before it
    # is abandoned and the suggestion dropped. Measured at 49ms over a seeded pipeline of
    # 200 and 3.0s over 50k, so this is twenty times the real cost and well under the
    # worst one: a pipeline that outgrows the design loses a line of text, not the request.
    relaxation-budget: ${SEARCH_RELAXATION_BUDGET:1s}
  seed:
    enabled: ${SEED_ENABLED:true}
    candidates: ${SEED_CANDIDATES:200}
    # Pin this to reproduce a screenshot exactly; otherwise the clock's day is used.
    base-instant: ${SEED_BASE_INSTANT:}
